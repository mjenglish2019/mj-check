<style>
/* Layout: one phone-width column; a highlighter swipe marks what to study, everything else stays quiet. */
:root{
  --paper:#f4f6fb; --surface:#ffffff; --ink:#1b2540; --muted:#5d6684; --line:#dde2ee;

  --ok:#17855a; --ok-bg:#e3f4ec; --bad:#c93d33; --bad-bg:#fbe7e5; --pend:#9a5b00; --pend-bg:#fff1d6;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#8fa2ff; --accent-ink:#0f1326; --hl:#e8cb3c; --hl-ink:#1d1a08;
  --ok:#55c995; --ok-bg:#16352a; --bad:#ff8277; --bad-bg:#3a1f22; --pend:#f2b85a; --pend-bg:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11152a; --surface:#1a2038; --ink:#e8ebf6; --muted:#9aa3c2; --line:#2b3354;
  --accent:#8fa2ff; --accent-ink:#0f1326; --hl:#e8cb3c; --hl-ink:#1d1a08;
  --ok:#55c995; --ok-bg:#16352a; --bad:#ff8277; --bad-bg:#3a1f22; --pend:#f2b85a; --pend-bg:#3a2c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:16px}

input[type=text],input[type=password],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}

input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 14px;min-height:46px}

.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}

.card{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;user-select:none}

.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.wlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wlist div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.wlist .en{font-family:var(--f-word);font-size:18px;font-weight:600;min-width:7.5em}
.copybox{white-space:pre-wrap;font-size:13.5px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.note{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--paper);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--muted);font-weight:500;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14.5px}
.bookrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.bookrow:last-child{border-bottom:0}
.typehead{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.built{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:56px;padding:10px;border-radius:12px;border:1.5px dashed var(--line);background:var(--paper)}
.tok{min-height:40px;padding:7px 12px;border-radius:9px;font-family:var(--f-word);font-size:18px}
.tok.on{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.endp{font-family:var(--f-word);font-size:20px}
.fb.pend,.verdict.pend,.badge.pend{background:var(--pend-bg);color:var(--pend)}
.todaybtn{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:700;border-color:var(--ink)}
.today-head{gap:6px}
.today-name{font-family:var(--f-display);font-size:34px;line-height:1.15}
.today-date{font-size:15px;font-variant-numeric:tabular-nums}
.today-sum{gap:6px 12px;font-size:14.5px}
.today-sum b{font-size:20px;font-variant-numeric:tabular-nums}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.trow{cursor:default;align-items:flex-start}
.tnum{font-variant-numeric:tabular-nums}
a.linkbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;padding:11px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;border:1.5px solid var(--accent)}
a.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.linkbtn.off{opacity:.45;pointer-events:none}
.a2hs{min-height:34px;padding:5px 11px;border-radius:999px;font-size:13.5px;font-weight:700;border-color:var(--accent);color:var(--accent);background:var(--surface);white-space:nowrap}
.a2hs[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:9;max-width:calc(100% - 32px)}
.dta{min-height:64px;font-size:15px}
html,body{overscroll-behavior-y:none}   /* 시험 중 화면을 아래로 당겨 새로고침되는 일을 막음 (2026-10-20) */
.dk{min-width:5em;font-weight:700;color:var(--muted);font-size:14px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"><div class="panel"><p class="muted">교재를 불러오는 중이에요…</p></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const TYPES={vocab:"단어",grammar:"문법",reading:"독해",naesin:"내신"};
/* 내신 탭 (2026-10-16): 학교 6곳. 자료는 books/<id>.json(type:"naesin", school:<학교 id>)로 넣고 content.json 인덱스에 school을 적는다 */
const SCHOOLS=[{id:"haenuri",name:"해누리중"},{id:"jamsilw-m",name:"잠실여중"},{id:"garak-m",name:"가락중"},{id:"garak-h",name:"가락고"},{id:"jamsilw-h",name:"잠실여고"},{id:"baemyung",name:"배명고"}];
const NUM=["①","②","③","④","⑤"];
const app=document.getElementById("app");
const S={content:null,full:{},me:null,view:"start",tab:"vocab",sel:{},quiz:null,cards:null,result:null,
  db:null,canEdit:false,admin:{tab:"results",q:"",changed:new Set(),removed:new Set(),rows:null,unsub:null,dirty:false,form:{type:"vocab",book:"",newBook:"",unit:"",text:"",passage:""},saveMsg:""}};

/* ---------- storage (per-device conveniences only) ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function stuKey(p){return "mj_"+p+"_"+S.me.name}
function normName(n){return String(n).replace(/\s+/g," ").trim()}
/* 이 기기에서 쓴 이름 목록 (학원 공용 폰처럼 여럿이 쓸 때 첫 화면에서 눌러 들어감) — 2026-10-13 */
function nameKey(n){return normName(n).replace(/\s+/g,"")}
function knownNames(){
  const used=lsGet("mj_names",{}),hidden=lsGet("mj_hidden",[]),seen=new Map();
  const add=(n,at)=>{n=normName(n||"");if(!n||hidden.includes(n))return;const p=seen.get(n);if(!p||at>p)seen.set(n,at)};
  Object.keys(used).forEach(n=>add(n,used[n]||0));
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||"";const m=k.match(/^mj_(?:hist|sel|wrong)_(.+)$/);if(m)add(m[1],0)}}catch(e){}
  const me=lsGet("mj_me",null);if(me&&me.name)add(me.name,0);
  return [...seen.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ko")).map(x=>x[0]);
}
function rememberName(n){const u=lsGet("mj_names",{});u[n]=Date.now();lsSet("mj_names",u);
  const h=lsGet("mj_hidden",[]);if(h.includes(n))lsSet("mj_hidden",h.filter(x=>x!==n))}
function hideName(n){const h=lsGet("mj_hidden",[]);if(!h.includes(n))h.push(n);lsSet("mj_hidden",h);
  const u=lsGet("mj_names",{});delete u[n];lsSet("mj_names",u);const me=lsGet("mj_me",null);if(me&&me.name===n)try{localStorage.removeItem("mj_me")}catch(e){}}
function hist(){return lsGet(stuKey("hist"),{})}
function wrongBook(){return lsGet(stuKey("wrong"),[])}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function lockMap(){return lsGet(stuKey("lock_"+dayKey()),{})}
function setLock(k,v){const m=lockMap();if(v===null)delete m[k];else m[k]=v;lsSet(stuKey("lock_"+dayKey()),m)}
function todayLog(){return lsGet(stuKey("log_"+dayKey()),[])}
function hm(iso){const d=new Date(iso);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
/* group today's attempts by book+unit: first score, last score, tries */
function todayGroups(){return groupLog(todayLog())}
function groupLog(log){
  const g=new Map();
  (log||[]).forEach(r=>{const k=r.type+"|"+r.bookName+"|"+r.unitName;
    if(!g.has(k))g.set(k,{type:r.type,bookName:r.bookName,unitName:r.unitName,tries:[]});g.get(k).tries.push(r)});
  return [...g.values()].map(x=>{const f=x.tries[0],l=x.tries[x.tries.length-1];
    return Object.assign(x,{first:f,last:l,passed:x.tries.some(t=>t.pass),final:!x.tries.some(t=>t.pass)&&x.tries.some(t=>t.final),start:f.at,end:l.at,
      away:x.tries.reduce((a,t)=>a+(t.away||0),0),awaySec:x.tries.reduce((a,t)=>a+(t.awaySec||0),0)})});
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function books(t){return (S.content.books||[]).filter(b=>b.type===t)}
function booksFor(t){return t==="naesin"?books(t).filter(b=>b.school===S.sel.naesinSchool):books(t)}
function findBook(id){return S.full[id]||(S.content.books||[]).find(b=>b.id===id)}
/* 시험마다 뽑는 문항 수: 문법 20(은행 전부, 순서만 랜덤), 독해 10(지문당 10문항 전부) — 2026-10-12 원장님 결정 */
const PICK_BY={grammar:20,reading:10,naesin:20};
function pickOf(t,b){return (b&&b.pick)||PICK_BY[t]||10}
const MAXRETRY=3;
/* 앱 버전 표시·자동 새로고침 (2026-10-15): 홈 화면 맨 아래 작은 글씨. 앱이 켜진 채로 새 버전이 올라오면 홈 화면으로 돌아올 때 새로고침 */
const BUILD="2026-10-28a";
async function checkBuild(){try{const r=await fetch("index.html?b="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/const BUILD="([^"]+)"/);
  if(m&&m[1]!==BUILD&&S.view!=="quiz"&&S.view!=="cards"&&S.view!=="diary"){toast("새 버전으로 바꿔요");setTimeout(()=>location.reload(),900)}}catch(e){}}
/* 화면 이탈 기록 (2026-10-13): 시험 중 다른 앱·홈 화면으로 나가면 횟수·시간을 남김. 1초 미만은 무시 */
let awayAt=0;
function awayKey(q){return q&&!q.wrongMode&&q.bookId?q.bookId+"/"+q.unitId:""}
function awayInit(q){q.away=0;q.awaySec=0;const k=awayKey(q),l=k&&lockMap()[k];
  if(l&&l.state==="started"&&(l.away||l.awaySec)&&(l.retryNo||0)===(q.retryNo||0)){q.away=l.away||0;q.awaySec=l.awaySec||0}}
function awaySave(q){const k=awayKey(q);if(!k)return;const m=lockMap();if(m[k]&&m[k].state==="started"){m[k].away=q.away;m[k].awaySec=q.awaySec;lsSet(stuKey("lock_"+dayKey()),m)}}
function awayTxt(n,sec){return n?`화면 이탈 ${n}회`+(sec>=60?` (${Math.round(sec/60)}분)`:` (${sec}초)`):""}
document.addEventListener("visibilitychange",()=>{
  const q=S.quiz;if(S.view!=="quiz"||!q)return;
  if(document.hidden){awayAt=Date.now();q.away=(q.away||0)+1;q.awaySec=q.awaySec||0;q.awayPend=true;awaySave(q)}
  else if(awayAt){const sec=Math.round((Date.now()-awayAt)/1000);awayAt=0;
    if(q.awayPend){q.awayPend=false;if(sec<1){q.away=Math.max(0,q.away-1)}else{q.awaySec+=sec;toast(`시험 중에 화면을 벗어났어요 (${q.away}회). 기록에 남아요`)}
      awaySave(q);render()}}
});
function unitCount(u){return u.items?u.items.length:(u.n||0)}
function metaOf(b){return {id:b.id,type:b.type,name:b.name,units:b.units.map(u=>({id:u.id,name:u.name,n:unitCount(u)}))}}
const loading={};
function loadBook(id){
  if(S.full[id])return Promise.resolve(S.full[id]);
  if(loading[id])return loading[id];
  loading[id]=fetch("books/"+encodeURIComponent(id)+".json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error("load");return r.json()})
    .then(b=>{S.full[id]=b;delete loading[id];return b}).catch(e=>{delete loading[id];throw e});
  return loading[id];
}
function findUnit(b,id){return b&&b.units.find(u=>u.id===id)}
function uid(p){return p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ul(h){return h.replace(/\[([^\]\n]{1,60})\]/g,"<u>$1</u>")}

function applyState(st){if(!st||!S.me)return;
  lsSet(stuKey("hist"),st.hist||{});lsSet(stuKey("wrong"),st.wrong||[]);lsSet(stuKey("wrongAt"),st.wrongAt||0);
  lsSet(stuKey("sel"),st.sel||{});lsSet(stuKey("selAt"),st.selAt||0);

/* 서버 Code.gs의 mergeState와 똑같이 유지 */
function mergeState(a,b){
  a=a||{};b=b||{};
  const day=[a.day||"",b.day||""].sort().pop();
  const A=a.day===day?a:{},B=b.day===day?b:{};
  const rank=l=>!l?-1:(l.state==="pass"||l.state==="final")?1e6:(l.retryNo||0)*2+(l.state==="open"?1:0);
  const lock=Object.assign({},A.lock||{});
  Object.keys(B.lock||{}).forEach(k=>{const x=lock[k],y=B.lock[k],rx=rank(x),ry=rank(y);
    if(ry>rx)lock[k]=y;else if(ry===rx&&x)lock[k]=Object.assign({},y,{away:Math.max(x.away||0,y.away||0),awaySec:Math.max(x.awaySec||0,y.awaySec||0),quitAt:Math.max(x.quitAt||0,y.quitAt||0),qDone:Math.max(x.qDone||0,y.qDone||0)})});
  const seen={},log=[];(A.log||[]).concat(B.log||[]).forEach(e=>{if(e&&e.at&&!seen[e.at]){seen[e.at]=1;log.push(e)}});
  log.sort((p,q)=>p.at<q.at?-1:p.at>q.at?1:0);
  const hp=h=>!h?-1:h.pass?3:h.final?2:1;
  const hist=Object.assign({},a.hist||{});
  Object.keys(b.hist||{}).forEach(k=>{const hx=hist[k],hy=b.hist[k];if(!hx||hp(hy)>hp(hx)||(hp(hy)===hp(hx)&&(hy.at||"")>=(hx.at||"")))hist[k]=hy});
  const wb=(b.wrongAt||0)>=(a.wrongAt||0)?b:a,sb=(b.selAt||0)>=(a.selAt||0)?b:a;
  const rids=(a.rids||[]).concat(b.rids||[]).filter((x,i,arr)=>arr.indexOf(x)===i).slice(-400);
  return {v:1,day,hist,wrong:wb.wrong||[],wrongAt:wb.wrongAt||0,sel:sb.sel||{},selAt:sb.selAt||0,lock,log,sent:[A.sent||"",B.sent||""].sort().pop()||null,rids,updated:Math.max(a.updated||0,b.updated||0)};
}

let syncing=false,syncAgain=false;
async function sync(){
  if(!useApi()||!S.me||!S.me.token)return;
  if(syncing){syncAgain=true;return}
  syncing=true;const me=S.me,box=outbox();S.sync=Object.assign({},S.sync,{state:"busy"});
  try{
    const res=await api({act:"push",id:me.id,token:me.token,state:collectState(),results:box});
    if(S.me!==me)return;
    if(!res||!res.ok){if(res&&res.code==="auth"){authFail();return}throw new Error(res&&res.code)}
    applyState(mergeState(collectState(),res.state));
    const done=new Set(box.map(r=>r.at));lsSet(stuKey("outbox"),outbox().filter(r=>!done.has(r.at)));
    S.sync={state:"ok",at:new Date().toISOString()};
  }catch(e){S.sync={state:"fail",at:S.sync.at}}
  finally{syncing=false;
    if(S.me&&S.view!=="quiz"&&S.view!=="cards"&&S.view!=="start"&&S.view!=="admin"&&S.view!=="diary")render();
    if(syncAgain){syncAgain=false;setTimeout(sync,400)}}
}

    ks.forEach(k=>{const nk=k.slice(0,k.length-from.length)+to;if(localStorage.getItem(nk)==null)localStorage.setItem(nk,localStorage.getItem(k))})}catch(e){}

  const passN=gs.filter(x=>x.passed).length;
  return header()+`<button class="ghost" data-act="home" style="align-self:flex-start">← 목록으로</button>
  <div class="panel today-head">
    <p class="muted small">감독 선생님 확인용</p>
    <div class="today-name">${esc(S.me.name)}</div>
    <p class="today-date">${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} · 지금 <span id="clock">${hm(d.toISOString())}</span></p>
    ${sinceLast(gs)}
  </div>
  ${gs.length?`<div class="units">${gs.map(x=>{const rk=x.final?finalKeyFor(x):"";return `<${rk?`button data-act="review" data-v="${esc(rk)}"`:"div"} class="unit trow">
      <div class="grow"><div class="name">${esc(TYPES[x.type]||x.type)} · ${esc(x.bookName)}${x.unitName?" "+esc(x.unitName):""}</div>
      <div class="muted small tnum">${x.tries.map(t=>t.pct).join(" → ")}점 · ${x.tries.length}회 · ${hm(x.start)}${x.tries.length>1?"~"+hm(x.end):""}</div>
      ${x.away?`<div class="small" style="color:var(--bad)"><b>${awayTxt(x.away,x.awaySec)}</b></div>`:""}
      ${!x.last.pass&&x.last.wrong&&x.last.wrong.length?`<div class="small" style="color:var(--bad)">남은 오답: ${esc(x.last.wrong.join(", "))}</div>`:""}
      ${rk?`<div class="small" style="color:var(--pend)"><b>눌러서 틀린 문제·해설 보기 ›</b></div>`:""}</div>
      <span class="badge ${x.passed?"ok":x.final?"pend":"bad"}">${x.passed?"통과":x.final?"조교 확인":"재시험 중"}</span></${rk?"button":"div"}>`}).join("")}</div>`
  :`<div class="panel"><div class="empty">오늘 본 시험이 아직 없어요.</div></div>`}
  ${useApi()?hwPanel():""}
  ${useApi()?syncNote():(gs.length?`<a class="linkbtn" href="${esc(submitUrl())}" target="_blank" rel="noopener" data-act="sent">원장님께 제출하기</a>
  ${(()=>{const t=lsGet(stuKey("sent_"+dayKey()),null);return t?`<p class="small ok-t" style="margin-top:-8px"><b>✓ 오늘 ${esc(t)}에 제출했어요.</b> 공부를 더 했으면 한 번 더 눌러요.</p>`
    :`<p class="muted small" style="margin-top:-8px">누르면 바로 원장님께 가요. 새 창에 "응답이 기록되었습니다"가 뜨면 끝이에요. 오늘 공부를 다 끝낸 뒤 눌러요.</p>`})()}`
  :`<span class="linkbtn off" aria-disabled="true">원장님께 제출하기</span>`)}
  <button class="wide" data-act="sharetoday" ${gs.length||hwNo(diaryToday()).length?"":"disabled"}>부모님께 카톡으로 보내기</button>
  <button class="wide" data-act="shareweek">최근 7일 기록 부모님께 보내기</button>
  <p class="muted small" style="margin-top:-8px">집에서 하루씩 공부하는 학생은 일주일에 한 번 이 버튼으로 모아서 보내도 돼요.</p>
  ${S.shareBox?`<div class="panel"><p class="muted small">아래 글을 길게 눌러 복사한 뒤 카톡에 붙여 넣으세요.</p><div class="copybox" id="tb">${esc(S.shareText||todayText())}</div></div>`:""}
  <div class="note">${useApi()?"":"제출한 뒤 "}이 화면을 감독 선생님께 보여 주세요.</div>`;
}
function vHome(){
  const t=S.tab;
  const tabs=`<div class="tabs" role="tablist">${["vocab","grammar","reading","naesin"].map(k=>`<button role="tab" data-act="tab" data-v="${k}" aria-selected="${k===t||(t==="wrong"&&k==="vocab")}">${TYPES[k]}</button>`).join("")}</div>`;
  let body="";
  if(t==="wrong"){
    const wb=wrongBook();
    body=`<button class="ghost" data-act="tab" data-v="vocab" style="align-self:flex-start">← 단어로</button><div class="panel"><h2>내 <span class="mark">오답 단어장</span></h2>
      <p class="muted small">단어 시험에서 틀린 단어가 모여요. 다시 맞히면 빠져요.</p>
      ${wb.length?`<div class="wlist">${wb.slice(0,40).map(x=>`<div><span class="en">${esc(x.w)}</span><span>${esc(x.m)}</span></div>`).join("")}</div>
      ${wb.length>40?`<p class="muted small">외 ${wb.length-40}개</p>`:""}
      <div class="row"><button class="grow" data-act="wrongcards">카드로 외우기</button><button class="primary grow" data-act="wrongtest">오답 시험 (${wb.length}개)</button></div>`
      :`<div class="empty">아직 틀린 단어가 없어요.</div>`}</div>`;
  }else{
    const list=booksFor(t);
    const sel=S.sel[t]&&list.some(x=>x.id===S.sel[t])?S.sel[t]:(list[0]&&list[0].id)||"";
    S.sel[t]=sel;
    const b=findBook(sel);
    const sch=t==="naesin"?SCHOOLS.find(x=>x.id===S.sel.naesinSchool):null;
    const schoolBar=t==="naesin"?`<div class="panel"><label class="lbl">학교 고르기</label>
      <div class="chips" role="tablist">${SCHOOLS.map(x=>`<button class="chip" role="tab" data-act="school" data-v="${x.id}" aria-pressed="${!!sch&&sch.id===x.id}" aria-selected="${!!sch&&sch.id===x.id}">${esc(x.name)}</button>`).join("")}</div>
      ${sch?"":`<p class="muted small">학교를 누르면 그 학교 내신 대비 자료가 나와요.</p>`}</div>`:"";
    if(t==="naesin"&&!sch)body=schoolBar;
    else if(t==="naesin"&&!list.length)body=schoolBar+`<div class="panel"><div class="empty">${esc(sch.name)} 내신 대비 자료를 준비하고 있어요.<br>자료가 올라오면 여기에 나와요.</div></div>`;
    else body=schoolBar+`<div class="panel">
      <label class="lbl" for="bk">${t==="naesin"?esc(sch.name)+" 자료 고르기":"내 "+TYPES[t]+" 교재 고르기"}</label>
      ${!list.length?`<div class="empty">등록된 ${TYPES[t]} 교재가 없어요. 원장님께 말씀드려 주세요.</div>`
        :`<select id="bk" data-act="book">${list.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`}
    </div>
    ${b?`<div class="units">${b.units.map(u=>{const key=b.id+"/"+u.id;return `<button class="unit" data-act="unit" data-v="${esc(u.id)}"><span class="name">${esc(u.name)}</span><span class="cnt">${t==="vocab"?unitCount(u)+"단어":Math.min(pickOf(t,b),unitCount(u))+"문항"}</span>${unitBadge(key,t)}</button>`}).join("")}</div>`:""}
    ${t==="vocab"?(()=>{const n=wrongBook().length;return `<button class="wide" data-act="tab" data-v="wrong">내 오답 단어장 <span class="badge ${n?"bad":"none"}">${n}개</span></button>`})():""}`;
  }
  const tn=todayGroups().length;
  return header()+`<button class="todaybtn" data-act="today"><span>오늘 본 시험</span><span class="badge ${tn?"ok":"none"}">${tn}개 단원</span></button>
  ${useApi()?`<p class="note" style="margin-top:-8px"><b style="color:var(--ink)">오늘 공부가 다 끝나면 부모님께 카톡을 보냅니다.</b><br>오늘 본 시험 → 부모님께 카톡으로 보내기</p>`:`<p class="note" style="margin-top:-8px"><b style="color:var(--ink)">오늘 시험이 다 끝난 후 마지막에 제출 버튼을 누릅니다.</b><br>오늘 본 시험 → 원장님께 제출하기</p>`}${useApi()?diaryCard():""}`+tabs+body+`<button class="ghost" data-act="logout">${useApi()?"로그아웃":"이름 바꾸기"}</button><p class="small muted" style="text-align:center;margin-top:18px">앱 버전 ${BUILD}</p>`;
}

function vVocabMenu(){
  const b=findBook(S.sel.vocab),u=findUnit(b,S.sel.unit);
  if(!u)return vHome();
  return header()+`<button class="ghost" data-act="home" style="align-self:flex-start">← 목록으로</button>
  <div class="stack"><p class="muted">${esc(b.name)}</p><h1>${esc(u.name)}</h1><p class="muted">${u.items.length}단어 · 통과 기준 ${passOf("vocab")}점</p></div>
  <div class="panel"><h2>1. <span class="mark">외우기</span></h2><p class="muted small">카드를 눌러 뜻을 확인하고, 모르는 단어만 다시 봐요.</p><button data-act="cards">카드로 외우기</button></div>
  <div class="panel"><h2>2. <span class="mark">시험 보기</span></h2><p class="muted small">뜻 고르기와 스펠링 쓰기가 섞여 나와요. 틀린 단어는 다시 볼 수 있어요.</p>${(()=>{const l=lockMap()[b.id+"/"+u.id];return l&&l.state==="final"?`<button class="primary" data-act="review" data-v="${esc(b.id+"/"+u.id)}">조교 확인 — 틀린 단어 보기</button>`:`<button class="primary" data-act="vtest">시험 시작</button>`})()}</div>
  <div class="panel"><h2>단어 목록</h2><div class="wlist">${u.items.map(x=>`<div><span class="en">${esc(x.w)}</span><span>${esc(x.m)}</span></div>`).join("")}</div></div>`;
}

function vCards(){
  const c=S.cards,it=c.list[c.i];
  if(!it){
    const unk=c.unknown;
    return header()+`<div class="panel"><h2>카드 한 바퀴 끝!</h2>
    <p>${c.list.length}개 중 <b>${c.list.length-unk.length}개</b>는 안다고 했어요.</p>
    ${unk.length?`<div class="wlist">${unk.map(x=>`<div><span class="en">${esc(x.w)}</span><span>${esc(x.m)}</span></div>`).join("")}</div>
    <button class="primary" data-act="cardsagain">모르는 ${unk.length}개만 다시</button>`:`<p class="muted">모두 안다고 했어요. 이제 시험을 봐요.</p>`}
    <div class="row">${c.back==="vocab"?`<button class="grow ${unk.length?"":"primary"}" data-act="vtest">시험 보기</button>`:""}<button class="grow" data-act="${c.back==="vocab"?"vmenu":"home"}">돌아가기</button></div></div>`;
  }
  return header()+`<div class="qmeta"><span>${esc(c.title)}</span><span>${c.i+1} / ${c.list.length}</span></div>
  <div class="progress"><i style="width:${(c.i/c.list.length)*100}%"></i></div>
  <div class="panel card" data-act="flip" role="button" tabindex="0" aria-label="카드 뒤집기">
    <div class="w">${esc(it.w)}</div>
    ${c.flip?`<div class="m">${esc(it.m)}</div>`:`<div class="hint">눌러서 뜻 보기</div>`}
  </div>
  <div class="row"><button class="grow" data-act="say">발음 듣기</button></div>
  <div class="row"><button class="grow danger" data-act="cardno">몰라요</button><button class="grow primary" data-act="cardyes">알아요</button></div>
  <button class="ghost" data-act="${c.back==="vocab"?"vmenu":"home"}">그만하기</button>`;
}

function vQuiz(){
  const q=S.quiz,it=q.items[q.i];
  const top=`<div class="qmeta"><span>${esc(q.title)}</span><span>${q.away?`<b style="color:var(--bad)">이탈 ${q.away}</b> · `:""}${q.i+1} / ${q.items.length}</span></div><div class="progress"><i style="width:${(q.i/q.items.length)*100}%"></i></div>`;
  let main="";
  const fb=q.fb;
  if(it.kind==="arrange"){
    const used=q.order||[];
    main=`<div class="panel"><p class="muted small">우리말에 맞게 단어를 순서대로 눌러 문장을 만드세요.</p><div class="prompt">${esc(it.ko)}</div>
      ${it.cond?`<p class="small muted">조건: ${esc(it.cond)}</p>`:""}
      <div class="built">${used.length?used.map((ti,k)=>`<button class="tok on" data-act="untok" data-v="${k}" ${fb?"disabled":""}>${esc(it.tokens[ti])}</button>`).join(""):`<span class="muted small">여기에 문장이 만들어져요</span>`}${it.end?`<span class="endp">${esc(it.end)}</span>`:""}</div>
      <div class="chips">${it.tokens.map((w,ti)=>used.includes(ti)?"":`<button class="tok" data-act="tok" data-v="${ti}" ${fb?"disabled":""}>${esc(w)}</button>`).join("")}</div>
      ${fb?"":`<div class="row"><button class="grow" data-act="tokreset">다시 놓기</button><button class="primary grow" data-act="arrange" ${used.length===it.tokens.length?"":"disabled"}>확인</button></div>`}</div>`;
  }else if(it.kind==="write"){
    main=`<div class="panel"><p class="muted small">우리말을 영어로 쓰세요.</p><div class="prompt">${esc(it.ko)}</div>
      ${it.cond?`<p class="small"><b>조건</b> ${esc(it.cond)}</p>`:""}
      <textarea id="wr" style="min-height:90px" autocapitalize="sentences" spellcheck="false" placeholder="영어 문장 쓰기" ${fb?"disabled":""}>${esc(q.typed||"")}</textarea>
      ${fb?"":`<button class="primary" data-act="write">제출</button>`}</div>`;
  }else if(it.kind==="fill"){
    main=`<div class="panel"><p class="muted small">${esc(it.prompt)}</p>
      ${it.ctx?`<div class="prompt ${it.ctx.length>90?"long":""}">${br(esc(it.ctx))}</div>`:""}
      ${it.hint?`<p class="small"><b>조건</b> ${esc(it.hint)}</p>`:""}
      <div class="endp" style="line-height:1.6">${blankify(it.s)}</div>
      <input type="text" id="fl" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="빈칸에 들어갈 말 쓰기" ${fb?"disabled":""} value="${esc(q.typed||"")}">
      ${fb?"":`<button class="primary" data-act="fill">확인</button>`}</div>`;
  }else if(it.kind==="spell"){
    main=`<div class="panel"><p class="muted small">뜻을 보고 영어 단어를 쓰세요.</p><div class="prompt">${esc(it.prompt)}</div>
      <input type="text" id="sp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 쓰기" ${fb?"disabled":""} value="${esc(q.typed||"")}">
      ${fb?"":`<button class="primary" data-act="spell">확인</button>`}</div>`;
  }else{
    const isWord=it.kind==="mean";
    main=`<div class="panel">${it.passage?`<div class="passage ipass">${ipass(it.passage)}</div>`:q.passage?`<div class="passage">${esc(q.passage)}</div>`:""}
      ${isWord?`<p class="muted small">알맞은 뜻을 고르세요.</p>`:""}
      <div class="prompt ${isWord?"word":(it.prompt.length>90?"long":"")}">${it.no?`<b>${it.no}.</b> `:""}${isWord?esc(it.prompt):br(blankify(it.prompt))}</div>
      <div class="choices">${it.choices.map((c,i)=>{let cls="";if(fb){if(i===it.answer)cls="right";else if(i===q.picked)cls="wrong"}
        return `<button class="choice ${cls}" data-act="pick" data-v="${i}" ${fb?"disabled":""}><span class="n">${NUM[i]}</span><span>${isWord?esc(c):ul(esc(chTxt(c,i)))}</span></button>`}).join("")}</div></div>`;
  }
  let fbh="";
  if(fb){
    fbh=fb.pending?`<div class="fb pend"><b>모범 답안과 달라요. 조교 선생님이 확인해요.</b><span class="exp">모범 답안: ${esc(fb.answerText)}</span>${it.exp?`<span class="exp">${esc(it.exp)}</span>`:""}</div>`
    :`<div class="fb ${fb.ok?"ok":"bad"}"><b>${fb.ok?"정답이에요.":"틀렸어요. 정답: "+esc(fb.answerText)}</b>${it.exp?`<span class="exp">${esc(it.exp)}</span>`:""}</div>
    <button class="primary wide" data-act="next">${q.i+1<q.items.length?"다음 문제":"결과 보기"}</button>`;
  }
  return header()+top+main+fbh+`<button class="ghost" data-act="quit">그만두기</button>`;
}

/* 조교 확인 화면 (2026-10-13): 재시험 3회 미통과 단원의 남은 틀린 문제·정답·해설 */
function openReview(k){S.review=k;S.view="review";render();window.scrollTo(0,0)}
function finalKeyFor(x){const m=lockMap();return Object.keys(m).find(k=>{const l=m[k];return l&&l.state==="final"&&l.meta&&l.meta.bookName===x.bookName&&l.meta.unitName===x.unitName})||""}
function vReview(){
  const l=lockMap()[S.review]||{},m=l.meta||{},items=l.items||[];
  const back=`<button class="ghost" data-act="home" style="align-self:flex-start">← 목록으로</button>`;
  const head=`<div class="panel" style="align-items:flex-start">
    <span class="verdict pend">조교 확인</span>
    <h2>${esc(m.bookName||"")} ${esc(m.unitName||"")}</h2>
    <p class="small">재시험 ${MAXRETRY}번을 모두 썼어요. <b>조교 선생님과 같이</b> 아래 문제를 다시 풀어요.</p>
    ${items.length?`<p class="muted small">남은 ${l.type==="vocab"?"단어":"문제"} ${items.length}개${l.type==="vocab"?"":" · 정답은 초록색이에요"}</p>`:""}</div>`;
  if(!items.length)return header()+back+head+`<div class="panel"><div class="empty">이 단원은 기능을 넣기 전에 잠겨서 틀린 문제 기록이 없어요. 내일 다시 풀 수 있어요.</div></div>`;
  let body="";
  if(l.type==="vocab")body=`<div class="panel"><div class="wlist">${items.map(x=>`<div><span class="en">${esc(x.w)}</span><span>${esc(x.m)}</span></div>`).join("")}</div></div>`;
  else body=(m.passage?`<div class="panel"><p class="muted small">지문</p><div class="passage" style="max-height:none">${esc(m.passage)}</div></div>`:"")+
    items.map((it,i)=>(it.passage&&(i===0||items[i-1].passage!==it.passage)?`<div class="panel"><p class="muted small">지문</p><div class="passage" style="max-height:none">${ipass(it.passage)}</div></div>`:"")+(it.kind==="fill"
      ?`<div class="panel"><p class="muted small">${i+1}. ${esc(it.prompt)}</p>
        ${it.ctx?`<div class="prompt ${it.ctx.length>90?"long":""}">${br(esc(it.ctx))}</div>`:""}
        ${it.hint?`<p class="small"><b>조건</b> ${esc(it.hint)}</p>`:""}
        <div class="endp" style="line-height:1.6">${blankify(it.s)}</div>
        <div class="fb ok"><b>정답: ${esc((it.answers||[]).join(" / "))}</b>${it.exp?`<span class="exp">${esc(it.exp)}</span>`:""}</div></div>`
      :`<div class="panel"><p class="muted small">${it.no?it.no+"번":(i+1)+"번"}</p>
        <div class="prompt ${String(it.prompt).length>90?"long":""}">${br(blankify(it.prompt))}</div>
        <div class="choices">${(it.choices||[]).map((c,j)=>`<div class="choice ${j===it.answer?"right":""}" style="border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;${j===it.answer?"border-color:var(--ok)":""}"><span class="n">${NUM[j]}</span><span>${ul(esc(chTxt(c,j)))}</span></div>`).join("")}</div>
        <div class="fb ok"><b>정답: ${NUM[it.answer]||""} ${ul(esc(chTxt((it.choices||[])[it.answer]||"",it.answer)))}</b>${it.exp?`<span class="exp">${esc(it.exp)}</span>`:""}</div></div>`)).join("");
  return header()+back+head+body+`<button class="wide" data-act="today">오늘 본 시험 보기</button>`;
}
function vResult(){
  const r=S.result;
  return header()+`<div class="panel" style="align-items:flex-start">
    <p class="muted">${esc(r.bookName)} · ${esc(r.unitName)}${r.retryNo?` · 재시험 ${r.retryNo}/${MAXRETRY}`:""}</p>
    <div class="row" style="align-items:flex-end;gap:14px"><span class="score">${r.pct}</span><span class="muted" style="padding-bottom:8px">점 (${r.correct}/${r.total})</span></div>
    <span class="verdict ${r.pass?"ok":(r.final||r.pending.length)?"pend":"bad"}">${r.pass?"통과":r.final?"조교 확인":r.pending.length?"확인 필요":"재시험"}</span>

function parseVocab(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    let w,m;
    if(line.includes("\t")){const p=line.split("\t");w=p[0];m=p.slice(1).join(" ")}
    else{const k=line.search(/[가-힣ㄱ-ㅎ(（~]/);if(k<=0)return;w=line.slice(0,k);m=line.slice(k)}
    w=w.replace(/^\s*\d+[\.\)]\s*/,"").replace(/[\s,:\-–=]+$/,"").trim();m=m.trim();
    if(w&&m)out.push({w,m});
  });
  return out;
}
function parseQs(txt){
  const out=[];
  txt.split(/\n\s*\n/).forEach(block=>{
    const lines=block.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const q=[],ch=[];let ans=-1,exp="";
    lines.forEach(l=>{
      let m;
      if((m=l.match(/^정답\s*[:：]?\s*([①②③④⑤1-5])/))){const c=m[1];ans=NUM.indexOf(c)>=0?NUM.indexOf(c):Number(c)-1}
      else if((m=l.match(/^해설\s*[:：]?\s*(.*)$/)))exp=m[1];
      else if((m=l.match(/^(?:[①②③④⑤]|\(?[1-5][\)\.])\s*(.+)$/)))ch.push(m[1]);
      else if(!ch.length)q.push(l.replace(/^\d+[\.\)]\s+/,""));
    });
    if(q.length&&ch.length>=2&&ans>=0&&ans<ch.length)out.push({q:q.join(" "),choices:ch,answer:ans,exp});
  });
  return out;
}
function parseWrite(txt){
  const out=[];
  txt.split(/\n\s*\n/).forEach(block=>{
    const it={ko:"",answers:[],cond:"",exp:"",mode:"write"};
    block.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{let m;
      if((m=l.match(/^(?:한글|우리말|문제)\s*[:：]\s*(.+)$/)))it.ko=m[1];
      else if((m=l.match(/^(?:정답|답)\s*[:：]\s*(.+)$/)))it.answers.push(m[1]);
      else if((m=l.match(/^조건\s*[:：]\s*(.+)$/)))it.cond=m[1];
      else if((m=l.match(/^해설\s*[:：]\s*(.+)$/)))it.exp=m[1];
      else if((m=l.match(/^유형\s*[:：]\s*(.+)$/)))it.mode=/배열/.test(m[1])?"arrange":"write";
      else if(!it.ko)it.ko=l.replace(/^\d+[\.\)]\s+/,"");});
    if(it.ko&&it.answers.length)out.push(it);
  });
  return out;
}
function parseFor(t,txt){return t==="vocab"?parseVocab(txt):t==="write"?parseWrite(txt):parseQs(txt)}

/* ---------- quiz builders ---------- */
function vocabItems(words,pool){
  const allM=pool.map(x=>x.m);
  return shuffle(words).map(x=>{
    if(/~/.test(x.w)||Math.random()<.5){
      const others=shuffle([...new Set(allM.filter(m=>m!==x.m))]).slice(0,3);
      const ch=shuffle([x.m].concat(others));
      return {kind:"mean",prompt:x.w,choices:ch,answer:ch.indexOf(x.m),src:x};
    }
    return {kind:"spell",prompt:x.m,answer:x.w,src:x};
  });
}
function allVocabPool(){let p=[];Object.values(S.full).filter(b=>b.type==="vocab").forEach(b=>b.units.forEach(u=>p=p.concat(u.items||[])));return p}
function launch(type,meta,items,retryNo){
  {const k=meta.bookId+"/"+meta.unitId,o=lockMap()[k],keep=o&&o.state==="started"&&(o.retryNo||0)===(retryNo||0);
    let aw=keep?o.away||0:0,as=keep?o.awaySec||0:0;
    /* 그만두기 → 같은 시험 이어 풀기: 그만둔 때부터 다시 시작한 때까지를 화면 이탈로 기록 (2026-10-15) */
    const qa=keep?o.quitAt||0:0,pend=qa>(keep?o.qDone||0:0);
    if(pend){const gap=Math.round((Date.now()-qa)/1000);if(gap>=1){aw+=1;as+=gap;setTimeout(()=>toast(`시험을 그만두었다가 이어서 풀었어요 (이탈 ${aw}회). 기록에 남아요`),300)}}
    setLock(k,{state:"started",type,retryNo,items,meta,away:aw,awaySec:as,quitAt:qa,qDone:qa})}
  sync();
  if(type==="vocab"){startVocabTest(items,Object.assign({},meta,{retry:retryNo>0,retryNo}));return}
  S.quiz={type,items:items.map(x=>Object.assign({kind:"mc"},x)),i:0,correct:0,wrong:[],fb:null,title:meta.title,bookId:meta.bookId,bookName:meta.bookName,
    unitId:meta.unitId,unitName:meta.unitName,passage:meta.passage||"",retry:retryNo>0,retryNo};
  awayInit(S.quiz);S.view="quiz";render();window.scrollTo(0,0);
}
function tryStart(type,b,u){
  const k=b.id+"/"+u.id,l=lockMap()[k];
  const meta={title:u.name,bookId:b.id,bookName:b.name,unitId:u.id,unitName:u.name,passage:u.passage||""};
  if(type==="vocab")meta.unitItems=u.items;
  if(l&&l.state==="pass"){toast("오늘 이미 통과한 단원이에요");return}
  if(l&&l.state==="final"){openReview(k);return}
  if(l&&l.state==="started"&&l.items){toast(l.retryNo?`재시험 ${l.retryNo}/${MAXRETRY}을 다시 봐요`:"보던 시험을 처음부터 다시 봐요");launch(type,meta,l.items,l.retryNo||0);return}
  if(l&&l.state==="open"&&l.items){const n=(l.retryNo||0)+1;toast(`재시험 ${n}/${MAXRETRY}을 봐요`);launch(type,meta,l.items,n);return}
  const items=type==="vocab"?u.items:(b.ordered?u.items.slice():shuffle(u.items)).slice(0,pickOf(type,b)).map(x=>{const o=x.a?{kind:"fill",prompt:x.q,ctx:x.ctx||"",hint:x.hint||"",s:x.s,answers:x.a,exp:x.exp}:{prompt:x.q,choices:x.choices,answer:x.answer,exp:x.exp};if(x.passage)o.passage=x.passage;if(x.no)o.no=x.no;return o});
  launch(type,meta,items,0);
}
function startVocabTest(words,meta){
  const pool=meta.unitItems&&meta.unitItems.length>=4?meta.unitItems:allVocabPool();
  S.quiz=Object.assign({items:vocabItems(words,pool),i:0,correct:0,wrong:[],fb:null,type:"vocab"},meta);
  awayInit(S.quiz);S.view="quiz";render();
}
function startQTest(type,b,u,items,retry){
  const built=type==="write"?items.map(writeItem):items.map(x=>Object.assign({kind:"mc"},x));
  S.quiz={type,items:built,i:0,correct:0,wrong:[],fb:null,
    title:u.name,bookId:b.id,bookName:b.name,unitId:u.id,unitName:u.name,passage:u.passage||"",retry:!!retry};
  S.view="quiz";render();
}

function writeItem(x){
  if(x.kind)return x;
  const model=(x.answers||[])[0]||"";
  if(x.mode==="arrange"){
    let body=model.trim(),end="";const m=body.match(/[.?!]$/);if(m){end=m[0];body=body.slice(0,-1)}
    const toks=body.split(/\s+/);let sh=shuffle(toks);let tries=0;while(toks.length>1&&sh.join(" ")===toks.join(" ")&&tries++<5)sh=shuffle(toks);
    return {kind:"arrange",ko:x.ko,cond:x.cond||"",tokens:sh,target:body,end,model,exp:x.exp||"",src:x};
  }
  return {kind:"write",ko:x.ko,cond:x.cond||"",answers:x.answers||[],model,exp:x.exp||"",src:x};
}
function normSent(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g," ").replace(/\s*([,.?!])\s*/g,"$1").replace(/[.?!]+$/,"").trim()}
function answer(ok,answerText,picked,pending){
  const q=S.quiz,it=q.items[q.i];
  q.picked=picked;q.fb={ok,answerText,pending:!!pending};
  if(ok)q.correct++;
  else if(pending)(q.pending=q.pending||[]).push({it,typed:q.typed});
  else q.wrong.push(it);
  render();
  if(ok&&q.type==="vocab"){setTimeout(()=>{if(S.quiz===q&&q.fb){next()}},650)}
}
function next(){
  const q=S.quiz;q.fb=null;q.picked=null;q.typed="";q.order=[];q.i++;
  if(q.i>=q.items.length)finish();else render();
  if(S.view==="quiz"){const sp=document.getElementById("sp")||document.getElementById("fl");if(sp)sp.focus()}
}

function finish(){
  const q=S.quiz,total=q.items.length,pct=Math.round(q.correct/total*100),bk=q.wrongMode?null:findBook(q.bookId),ps=(bk&&bk.pass)||passOf(q.type);
  const pass=pct>=ps;
  const wrong=q.type==="vocab"?q.wrong.map(it=>it.src):q.wrong.map(it=>it.kind==="arrange"||it.kind==="write"?{q:it.ko,a:it.model,src:it}:it.kind==="fill"?{q:(it.ctx?it.ctx+" → ":"")+it.s,a:it.answers[0],src:it}:{q:it.prompt,a:it.choices[it.answer],src:it});
  const pending=(q.pending||[]).map(p=>({q:p.it.ko,a:p.it.model,typed:p.typed,src:p.it}));
  // wrong-word notebook
  if(q.type==="vocab"){
    let wb=wrongBook();
    const rightSet=new Set(q.items.filter(it=>!q.wrong.includes(it)).map(it=>it.src.w));
    if(q.wrongMode)wb=wb.filter(x=>!rightSet.has(x.w));
    wrong.forEach(x=>{if(!wb.some(y=>y.w===x.w))wb.push({w:x.w,m:x.m})});
    lsSet(stuKey("wrong"),wb);lsSet(stuKey("wrongAt"),Date.now());
  }
  const resAt=new Date().toISOString();
  {const lg=todayLog();lg.push({at:resAt,type:q.type,bookName:q.wrongMode?"오답 단어장":q.bookName,unitName:q.wrongMode?"":q.unitName,
    pct,pass,correct:q.correct,total,retry:!!(q.retry||q.wrongMode),retryNo:q.retryNo||0,final:!pass&&(q.retryNo||0)>=MAXRETRY,wrong:q.type==="vocab"?wrong.map(x=>x.w).slice(0,40):[],pend:(q.pending||[]).length,away:q.away||0,awaySec:q.awaySec||0});
    lsSet(stuKey("log_"+dayKey()),lg)}
  const rn=q.retryNo||0,final=!pass&&rn>=MAXRETRY;
  if(!q.wrongMode){const h=hist(),k=q.bookId+"/"+q.unitId;
    if(!q.retry)h[k]={pct,pass,at:new Date().toISOString()};
    else if(h[k]){if(pass){h[k].pass=true;h[k].retryPassed=rn}else if(final)h[k].final=true}
    lsSet(stuKey("hist"),h);
    if(pass)setLock(k,{state:"pass"});
    else if(final)setLock(k,{state:"final",type:q.type,at:new Date().toISOString(),
      meta:{bookName:q.bookName,unitName:q.unitName,passage:q.passage||""},
      items:q.type==="vocab"?q.wrong.map(it=>({w:it.src.w,m:it.src.m})):q.wrong.map(carry)});
    else setLock(k,{state:"open",type:q.type,retryNo:rn,items:q.type==="vocab"?q.wrong.map(it=>({w:it.src.w,m:it.src.m})):q.wrong.map(carry)});}
  const now=new Date();
  const label=q.wrongMode?"오답 단어장":q.bookName+" "+q.unitName;
  const lines=[`[엠제이 점검] ${S.me.name}`,`${TYPES[q.type]} | ${label}${rn?` (재시험 ${rn}/${MAXRETRY})`:""}`,`${q.correct}/${total} · ${pct}점 · ${pass?"통과":final?"재시험 3회 미통과 → 조교 확인":"재시험"}`];
  if(wrong.length)lines.push("틀림: "+(q.type==="vocab"?wrong.map(x=>x.w).join(", "):wrong.length+"문제"));
  if(q.away)lines.push(awayTxt(q.away,q.awaySec||0));
  if(pending.length){lines.push("조교 확인 필요 "+pending.length+"문제:");pending.forEach(p=>lines.push("- "+p.q+" → "+p.typed))}
  lines.push(`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`);
  S.result={type:q.type,retryNo:rn,final,pct,pass,passScore:ps,correct:q.correct,total,wrong,pending,retry:q.retry,wrongMode:q.wrongMode,
    bookName:q.wrongMode?"오답 단어장":q.bookName,unitName:q.wrongMode?"":q.unitName,text:lines.join("\n"),saved:null,quiz:q,away:q.away||0,awaySec:q.awaySec||0};
  if(useApi()){const ob=outbox();ob.push({at:resAt,type:q.type,bookName:q.wrongMode?"오답 단어장":q.bookName,unitName:q.wrongMode?"":q.unitName,
    pct,pass,final,correct:q.correct,total,retryNo:rn,wrong:q.type==="vocab"?wrong.map(x=>x.w).slice(0,60):[],wrongN:wrong.length,
    away:q.away||0,awaySec:q.awaySec||0,pend:pending.map(p=>p.q+" → "+p.typed).slice(0,20)});lsSet(stuKey("outbox"),ob.slice(-200))}
  S.view="result";render();
  saveResult(S.result);sync();
}

      correct:r.correct,total:r.total,pct:r.pct,pass:r.pass,retry:!!(r.retry||r.wrongMode),
      wrong:r.type==="vocab"?r.wrong.map(x=>x.w).slice(0,60):[],

function doSpell(){
  const q=S.quiz;if(!q||q.fb)return;const el=document.getElementById("sp");const v=(el?el.value:"").trim();
  if(!v){toast("단어를 써 주세요");return}
  q.typed=v;const it=q.items[q.i];
  const norm=s=>s.toLowerCase().replace(/\s+/g," ").replace(/[’']/g,"'").trim();
  /* 같은 뜻을 가진 다른 단어(예: suppose/assume)도 정답으로 인정 */
  const pool=(q.unitItems||[]).concat(q.items.map(x=>x.src)).filter(x=>x&&x.m===it.src.m&&!/~/.test(x.w)).map(x=>x.w);
  const vars=[];[...new Set([it.answer].concat(pool))].forEach(ans=>ans.split("/").forEach(a=>{vars.push(a);if(/\(.+\)/.test(a)){vars.push(a.replace(/\s*\([^)]*\)/g,""));vars.push(a.replace(/[()]/g,""))}}));
  const ok=vars.some(a=>norm(a)===norm(v));
  answer(ok,it.answer,null);
}
function doFill(){
  const q=S.quiz;if(!q||q.fb)return;const el=document.getElementById("fl");const v=(el?el.value:"").trim();
  if(!v){toast("빈칸에 들어갈 말을 써 주세요");return}
  q.typed=v;const it=q.items[q.i];
  const ok=it.answers.some(a=>normFill(a)===normFill(v));
  answer(ok,it.answers.join(" / "),null);
}

  S.sel=lsGet(stuKey("sel"),{});S.tab="vocab";goHome();
}

function exportJson(){const a=S.admin;return JSON.stringify({index:S.content,books:[...a.changed].map(id=>S.full[id]).filter(Boolean),removed:[...a.removed]})}
function selectText(id){const n=document.getElementById(id);if(!n)return;const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)}

async function saveContent(){
  readForm();const a=S.admin;
  let art=null;try{art=await window.claude.use("artifact")}catch(e){}
  if(!art){a.saveMsg="이 화면에서는 저장할 수 없어요. 아래 교재 데이터를 복사해서 Claude에게 보내 주시면 반영해 드려요.";a.showJson=true;render();return}
  try{
    const files={"content.json":{content:JSON.stringify(S.content),contentType:"application/json"}};
    a.changed.forEach(id=>{if(S.full[id])files["books/"+id+".json"]={content:JSON.stringify(S.full[id]),contentType:"application/json"}});
    a.removed.forEach(id=>{files["books/"+id+".json"]=null});
    await art.publish(files);
    a.changed.clear();a.removed.clear();a.dirty=false;a.saveMsg="저장했어요. 학생들이 새로 열면 바뀐 교재가 보여요.";a.showJson=false;
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict")a.saveMsg="다른 곳에서 먼저 저장했어요. 페이지를 새로 연 뒤 다시 추가해 주세요.";
    else if(code==="capability_disabled"||code==="not_writer"||code==="not_granted")a.saveMsg="공유 중인 페이지라 여기서는 저장할 수 없어요. 아래 교재 데이터를 복사해서 Claude에게 보내 주시면 반영해 드려요.";
    else a.saveMsg="저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.";
    if(code!=="conflict")a.showJson=true;
  }
  render();
}

/* ---------- boot ---------- */
async function boot(){
  try{const r=await fetch("content.json",{cache:"no-store"});if(!r.ok)throw 0;S.content=await r.json()}
  catch(e){app.innerHTML=`<div class="panel"><p>교재를 불러오지 못했어요. 페이지를 새로 열어 주세요.</p></div>`;return}
  S.content.books=S.content.books||[];
  const me=lsGet("mj_me",null);
  /* 이 폰을 한 명만 쓰면 바로 들어가고, 여러 명이 쓴 폰이면 이름 목록부터 보여 줌 */
  if(useApi()){if(me&&me.name&&me.token){S.me=me;S.sel=lsGet(stuKey("sel"),{});S.view="home"}}
  else if(me&&me.name){if(!lsGet("mj_names",{})[me.name])rememberName(me.name);
    if(knownNames().length<=1){S.me=me;S.sel=lsGet(stuKey("sel"),{});S.view="home"}}
  render();
  if(useApi()&&S.me){sync();diaryLoad()}
  if(window.claude&&window.claude.use){
    window.claude.use("user").then(async u=>{if(!u)return;let ok=false;try{ok=await u.canEdit()}catch(e){}
      if(ok){S.canEdit=true;if(S.view!=="quiz"&&S.view!=="cards")render()}}).catch(()=>{});
    window.claude.use("db").then(db=>{S.db=db||null}).catch(()=>{});
  }
